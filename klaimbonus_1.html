<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Lucky Draw</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      padding: 50px;
    }
    textarea {
      width: 300px;
      height: 150px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    #winner {
      margin-top: 20px;
      font-size: 22px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🎉 Lucky Draw 🎉</h1>
  <p>Masukkan nama peserta (1 baris = 1 nama)</p>

  <textarea id="names" placeholder="Contoh:
Andi
Budi
Siti
Rina"></textarea>
  <br>
  <button onclick="drawWinner()">🎯 Undi Sekarang</button>

  <div id="winner"></div>

  <script>
    function drawWinner() {
      const text = document.getElementById("names").value;
      const names = text.split("\n").filter(n => n.trim() !== "");

      if (names.length === 0) {
        alert("Masukkan minimal 1 nama!");
        return;
      }

      const randomIndex = Math.floor(Math.random() * names.length);
      const winner = names[randomIndex];

      document.getElementById("winner").innerHTML =
        "❌ Belum rezeki 😁<br>Coba lagi ya!";
    }
  </script>

</body>
</html>
